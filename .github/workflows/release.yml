name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  android:
    name: Android release APK
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "WB_KEYSTORE_B64 secret missing" >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          WB_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_VERSION_NAME: ${{ github.ref_name }}
          WB_VERSION_CODE: ${{ github.run_number }}
        run: |
          export WB_VERSION_NAME="${WB_VERSION_NAME#v}"
          ./gradlew --no-daemon :app:assembleRelease
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/wifi-bridge-${WB_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ runner.temp }}/wifi-bridge-*.apk

  macos:
    name: macOS release app
    needs: ci
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build WiFiBridge.app
        env:
          WB_VERSION_NAME: ${{ github.ref_name }}
          WB_VERSION_CODE: ${{ github.run_number }}
        run: |
          export WB_VERSION_NAME="${WB_VERSION_NAME#v}"
          scripts/build-app.sh
          ditto -c -k --keepParent build/WiFiBridge.app "build/WiFiBridge-${WB_VERSION_NAME}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: macos/build/WiFiBridge-*-macos.zip

  publish:
    name: Publish GitHub release
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # Exactly the two shipped files: the signed APK and the macOS zip.
          test "$(find dist -type f | wc -l)" -eq 2
          ls dist/wifi-bridge-*.apk dist/WiFiBridge-*-macos.zip
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "WiFi Bridge $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md

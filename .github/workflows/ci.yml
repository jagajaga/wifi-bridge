name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vectors:
    name: Test vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python scripts/gen_test_vectors.py
      - name: Generated vectors match the committed file
        run: git diff --exit-code docs/test-vectors.json

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-bridge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  swift-linux:
    name: Protocol core (Linux / BoringSSL)
    runs-on: ubuntu-latest
    container: swift:6.1
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  macos:
    name: macOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Protocol core tests (CryptoKit)
        run: swift test
      - name: Throwaway self-signed "Developer ID" identity (exercises the release signing path)
        run: |
          d="$RUNNER_TEMP/ci-cert"; mkdir -p "$d"
          cat > "$d/ext.cnf" <<'CNF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = Developer ID Application: CI Throwaway (CITEST0000)
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          CNF
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config "$d/ext.cnf" \
            -keyout "$d/key.pem" -out "$d/cert.pem"
          openssl pkcs12 -export -legacy -inkey "$d/key.pem" -in "$d/cert.pem" \
            -passout pass:ci -out "$d/cert.p12" 2>/dev/null \
            || openssl pkcs12 -export -inkey "$d/key.pem" -in "$d/cert.pem" -passout pass:ci -out "$d/cert.p12"
          echo "CERT_P12_B64=$(base64 -i "$d/cert.p12" | tr -d '\n')" >> "$GITHUB_ENV"
          echo "CERT_PASSWORD=ci" >> "$GITHUB_ENV"
          echo "CERT_TRUST_PEM=$d/cert.pem" >> "$GITHUB_ENV"
      - name: Import it the way the release does
        run: scripts/import-signing-cert.sh "$RUNNER_TEMP/ci.keychain-db"
      - name: Build WiFiBridge.app (hardened runtime, signed with the throwaway identity)
        run: |
          scripts/build-app.sh
          codesign -d --entitlements - --xml build/WiFiBridge.app | grep -q personal-information.location
          codesign -dv build/WiFiBridge.app 2>&1 | tee /dev/stderr | grep -q 'flags=0x10000(runtime)'
      - name: Check bundle
        run: |
          plutil -lint build/WiFiBridge.app/Contents/Info.plist
          lipo -archs build/WiFiBridge.app/Contents/MacOS/WiFiBridge
          codesign --verify --verbose build/WiFiBridge.app
      - name: Zip
        run: ditto -c -k --keepParent build/WiFiBridge.app build/WiFiBridge-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-bridge-macos
          path: macos/build/WiFiBridge-macos.zip
